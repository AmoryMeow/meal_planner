components:
  schemas:
    AccessEnum:
      enum:
      - read
      - edit
      type: string
      description: |-
        * `read` - Read
        * `edit` - Edit
    AccessToken:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        role:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/NullEnum'
        plan_id:
          type: integer
          readOnly: true
        member_count:
          type: integer
          minimum: 0
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - member_count
      - name
      - plan_id
      - role
      - updated_at
    GroupDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        role:
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/RoleEnum'
          - $ref: '#/components/schemas/NullEnum'
        plan_id:
          type: integer
          readOnly: true
        member_count:
          type: integer
          minimum: 0
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
          readOnly: true
      required:
      - created_at
      - id
      - member_count
      - members
      - name
      - plan_id
      - role
      - updated_at
    GroupDetailRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          minLength: 1
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
      required:
      - name
    GroupMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - id
      - last_name
      - role
      - user_id
    GroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        color:
          type: string
          minLength: 1
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
      required:
      - name
    Ingredient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    IngredientRequest:
      type: object
      properties:
        name:
          type: string
