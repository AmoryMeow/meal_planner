[tool.ruff]
# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "venv_local",
    "migrations",
]

# Set the maximum line length to 88 (Black's default)
line-length = 88
indent-width = 4

# Assume Python 3.9
target-version = "py39"

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "I",     # isort
    "N",     # pep8-naming
    "C4",    # flake8-comprehensions
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate
    "PL",    # Pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "PERF",  # Perflint
    "RUF",   # Ruff-specific rules
]

# Ignore specific rules that are too strict for Django projects
ignore = [
    "E501",    # Line too long (handled by line-length setting)
    "B008",    # Do not perform function calls in argument defaults (Django uses this pattern)
    "RUF012",  # Mutable class attributes (Django models use this)
    "N806",    # Variable in function should be lowercase (Django uses camelCase in some places)
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value used in comparison
    "TRY003",  # Avoid specifying long messages outside the exception class
    "ARG002",  # Unused method argument (Django views often have unused args)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, etc.
"**/tests/**/*.py" = [
    "PLR2004",  # Magic value used in comparison
    "S101",     # Use of assert detected
    "ARG",      # Unused function args
    "FBT",      # Don't care about booleans as positional arguments in tests
    "PLR0913",  # Too many arguments to function call
    "PLR0915",  # Too many statements
]

# Django settings files can have uppercase variables
"**/settings.py" = [
    "F403",    # 'from module import *' used; unable to detect undefined names
    "F405",    # Name may be undefined, or defined from star imports
]

# Django migrations can be long and have specific naming
"**/migrations/*.py" = [
    "E501",    # Line too long
    "N806",    # Variable in function should be lowercase
]

# Django manage.py has imports in try/except
"manage.py" = [
    "PLC0415",  # Import should be at top-level
]

[tool.ruff.lint.isort]
# Use Django import order
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.ruff.format]
# Like Black, use double quotes for strings
quote-style = "double"

# Like Black, indent with spaces, rather than tabs
indent-style = "space"

# Like Black, respect magic trailing commas
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending
line-ending = "auto"
